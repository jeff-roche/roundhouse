[package]
name = "roundhouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Enables `Event::from_persisted`, a constructor reserved for reconstructing
# `Event`s from rows already durably written to the append-only `events`
# table (S-LOG-2 replay), not for minting new events (see event.rs). Only
# `roundhouse-store` (and equivalents) should opt into this.
replay = []

[dev-dependencies]
serde_json = { workspace = true }
trybuild = "1"

[dependencies]
serde = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["uuid1", "bytes1"] }

[[test]]
name = "replay_feature"
path = "tests/replay_feature.rs"
required-features = ["replay"]
