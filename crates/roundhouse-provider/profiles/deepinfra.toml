# DeepInfra — hosted OpenAI-compatible catalog of third-party open models.
# Verified against docs.deepinfra.com/chat/overview (redirect target of
# deepinfra.com/docs/openai_api, fetched live 2026-09): base_url
# `https://api.deepinfra.com/v1/openai` and Bearer auth
# (`Authorization: Bearer $DEEPINFRA_TOKEN`) confirmed verbatim. DeepInfra
# hosts many different underlying models with no single vendor-specific
# request quirk, so this is a plain pass-through profile.
id = "deepinfra"
codec = "openai-chat"
# Round-8 review, M1/M2: the previous table's three keys were fabricated —
# none were ever verified against a real DeepInfra response. Verified live
# by curling `api.deepinfra.com/v1/openai/chat/completions` directly
# (2026-09; no valid billing account available, so only the auth-failure
# path was reachable): the real shape is nested and OpenAI-like but puts
# the fine-grained machine code under `/error/code`, not `/error/type`
# (which only carries the coarse `"invalid_request_error"` bucket shared by
# many unrelated 4xxs) —
#   `{"error":{"message":"User is not authorized to access this
#   resource","type":"invalid_request_error","param":null,
#   "code":"invalid_api_key"}}`
# `error_pointer` is corrected to `/error/code` accordingly. The one code
# actually observed, `invalid_api_key`, is an authentication failure, not a
# billing/quota condition or a model-not-found — it maps to none of the
# four `ProviderErrorKind` variants, so (per fix-round-1 E1's precedent for
# an unmappable code) it is not added to the table rather than guessed as
# `QuotaExhausted` the way the old, fabricated "insufficient_balance" entry
# did. No 429/insufficient-balance/model-not-found response could be
# triggered without valid billable credentials, and no vendor documentation
# names their codes either, so this table is deliberately empty rather
# than inventing values for the unreachable cases.
error_pointer = "/error/code"
[defaults]
allow_raw_extra = false
params = { mode = "deny_list", fields = [] }
base_url = "https://api.deepinfra.com/v1/openai"
auth = { kind = "bearer" }

[[model]]
match = ["*"]

[errors]
