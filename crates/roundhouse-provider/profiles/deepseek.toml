# DeepSeek — direct vendor API.
#
# Corrected against the plan brief after live verification:
# - base_url: api-docs.deepseek.com/api/create-chat-completion and
#   .../quick_start/first_api_call (fetched 2026-09) both give the bare
#   `https://api.deepseek.com` with no documented `/v1` alias — the brief
#   assumed `/v1`; current docs disagree, so this profile uses the
#   currently-documented value.
# - presence_penalty/frequency_penalty: the same page states both are "no
#   longer supported" for the current model catalog (deepseek-v4-flash,
#   deepseek-v4-pro, deepseek-v4-flash-vision-exp) — API-wide, not scoped to
#   a "reasoner" model as the brief assumed (that model name no longer
#   appears in the current catalog at all).
# - reasoning: api-docs.deepseek.com/guides/reasoning_model (fetched 2026-09)
#   shows depth is controlled by a top-level `reasoning_effort` field,
#   separate from a `thinking: {"type": "enabled"}` toggle object. This
#   profile targets `reasoning_effort`, the effort-vocabulary control our
#   schema expresses.
id = "deepseek"
codec = "openai-chat"

[defaults]
allow_raw_extra = false
base_url = "https://api.deepseek.com"

[defaults.params]
mode = "deny_list"
fields = ["presence_penalty", "frequency_penalty"]

[defaults.auth]
kind = "bearer"

[[model]]
match = ["deepseek-v4*"]

[model.reasoning]
kind = "effort"
field = "/reasoning_effort"
vocabulary = ["low", "medium", "high"]

[model.reasoning.map]
off = "low"
low = "low"
medium = "medium"
high = "high"
max = "high"


# Round-8 review, M1/M2: the previous table's three keys
# (rate_limit_exceeded/server_error/authentication_error) never appear
# anywhere in DeepSeek's real error body and were pure fabrication.
# DeepSeek's real error body is `{"error": "<status> <reason phrase>",
# "message": "..."}` — `error` is a FLAT STRING (e.g. "429 Too Many
# Requests"), not an object with a `type`/`code` key, so `/error/type` (or
# any object-pointer) can never resolve. Two independent sources agree on
# this shape: reproduced 429 responses on aggregator sites
# (deepseek-usa.ai/docs/deepseek-error-codes; consistent with community
# reports of the literal body `{"error":"429 Too Many Requests","message":
# "Rate limit exceeded..."}`), and DeepSeek's own
# `api-docs.deepseek.com/quick_start/error_codes` page (fetched 2026-09),
# which documents only HTTP-status-keyed causes (400/401/402/422/429/500/
# 503) and never shows a machine-readable code string alongside them.
# There is no stable field to key a code_table on — the only candidate is
# the whole human-readable phrase, which is a message, not a code — so
# this table is deliberately empty. The HTTP-status fallback tier
# (`classify()`'s third tier) already gives 429 -> RateLimited and
# 500/503 -> Server correctly for this vendor; a real 402-vs-429 quota
# distinction cannot be built here without fabricating a match on message
# text, which this profile does not do.
[errors]
