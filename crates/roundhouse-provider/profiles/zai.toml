# Z.ai (Zhipu GLM) — direct vendor API.
#
# Corrected against the plan brief after live verification against
# docs.z.ai/api-reference/llm/chat-completion (fetched 2026-09): the
# `thinking` object's `type` field is a binary `"enabled"`/`"disabled"`
# switch, NOT a graduated effort vocabulary — the brief's design put the
# graduated vocabulary there. The real graduated control is a *separate*
# top-level `reasoning_effort` parameter:
#   - glm-5.3 / glm-5.3-flash: exactly ["low", "high", "max"] (3 values,
#     matching §9.5's own "glm-5.3: 3 values" claim — the value COUNT the
#     plan predicted was right, the field name was wrong).
#   - glm-5.2 and above: the full ["max", "xhigh", "high", "medium", "low",
#     "minimal", "none"] (7 values, matching "glm-5.2: 7 values").
# This profile's ReasoningControl targets `/reasoning_effort` for both
# entries, not `/thinking/type`.
id = "zai"
codec = "openai-chat"

[defaults]
allow_raw_extra = false
base_url = "https://api.z.ai/api/paas/v4"

[defaults.params]
mode = "deny_list"
fields = []

[defaults.auth]
kind = "bearer"

[[model]]
match = ["glm-5.3*"]

[model.reasoning]
kind = "effort"
field = "/reasoning_effort"
vocabulary = ["low", "high", "max"]

[model.reasoning.map]
off = "low"
low = "low"
medium = "high"
high = "high"
max = "max"

[[model]]
match = ["glm-5.2*"]

[model.reasoning]
kind = "effort"
field = "/reasoning_effort"
vocabulary = ["max", "xhigh", "high", "medium", "low", "minimal", "none"]

[model.reasoning.map]
off = "none"
low = "low"
medium = "medium"
high = "high"
max = "max"

[errors]
"1302" = { disposition = "shed_concurrency" }
"1301" = { disposition = "retry_backoff" }
"1113" = { disposition = "fatal", category = "quota" }
