id = "openrouter"
codec = "openai-chat"
[defaults]
allow_raw_extra = false
params = { mode = "deny_list", fields = [] }
base_url = "https://openrouter.ai/api/v1"
auth = { kind = "bearer" }

[[model]]
match = ["*"]

[errors]
"rate_limit_exceeded"  = { disposition = "shed_concurrency" }
"provider_overloaded"  = { disposition = "retry_backoff" }
"insufficient_credits" = { disposition = "fatal", category = "quota" }
