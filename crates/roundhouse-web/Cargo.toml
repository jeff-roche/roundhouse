[package]
name = "roundhouse-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
roundhouse-proto = { path = "../roundhouse-proto" }
# Task 31 (Phase 5, Subsystem D2): §11.3's SSE cursor is `(session_id, seq)`,
# and `SessionId` lives here. `roundhouse-proto` uses it but does not
# re-export it, so there is no way to reach it through the existing edge.
#
# TRACKED DEVIATION from §5.2's original `roundhouse-web` row (`proto`),
# authorised by ruling P9 ("`roundhouse-web` may depend on `roundhouse-flow`,
# `roundhouse-core`, and `roundhouse-store`"), same style as the
# `roundhouse-sched -> roundhouse-bus` deviation. Recorded in §5.2 of
# `docs/architecture/02-system-architecture.md` and in
# `xtask/tests/workspace_shape.rs`'s exact-set assertion, both in the same
# commit as this line — that test's failure message requires it.
roundhouse-core = { path = "../roundhouse-core" }
# Task 30 (Phase 5, Subsystem D1): the inbound HTTP server framework for the
# web UI. Chosen over hand-rolled `hyper` or `actix-web` because it is written
# by the `tokio`/`hyper` team (no ecosystem-fit risk against the workspace's
# pinned tokio 1.53) and needs zero non-tokio runtime glue. §5.3 pins no
# inbound server framework, so this is a net-new addition; it is recorded in
# the §5.3 additions table in `docs/architecture/02-system-architecture.md`.
# Exact `=` pin, not a `0.8` range: §5.3's pin discipline is "never track to
# latest", and a soft range is precisely what that forbids.
axum = "=0.8.4"
# Task 30 (Phase 5, Subsystem D1): compiles `assets/dist/` into the library, so
# the web client ships inside the daemon binary rather than as files the
# operator has to deploy alongside it (P10 — `roundhouse-web` links into
# `roundhouse-daemon`).
#
# `debug-embed` is REQUIRED, not a convenience: without it `rust-embed` reads
# from the filesystem in debug builds, and `cargo test` is a debug build — the
# embedding this crate exists to do would never be exercised by its own tests.
# `mime-guess` gives `EmbeddedFile::metadata().mimetype()`, the content type
# recorded at embed time; taking it from `rust-embed` avoids declaring
# `mime_guess` a second time as a direct dependency for what this crate
# already provides.
#
# Net-new addition, so the same exact-`=` pin discipline applies regardless of
# which task introduces it (`roundhouse-cli/Cargo.toml`): pinned to the
# current 8.12.0 rather than a `8` range.
rust-embed = { version = "=8.12.0", features = ["debug-embed", "mime-guess"] }
# Task 31 (Phase 5, Subsystem D2): `broadcast` for the SSE fan-out hub, and
# the runtime the stream is polled on.
#
# This REPLACES the `[dev-dependencies]` entry Task 30 added, and supersedes
# the reasoning in its comment. That comment said a router is data and this
# crate builds one without starting a runtime, which was true while the crate
# only served static bytes. `sse.rs` holds a live `tokio::sync::broadcast`
# channel per process and a stream polled by the server, so `tokio` is now a
# real, non-test dependency. Still no listener and no runtime *started* here:
# whoever binds the socket in `roundhouse-daemon` brings the runtime.
#
# `{ workspace = true }` rather than a narrow feature list, matching every
# other crate: `sync` (broadcast) and `time` (the tests' timeout) are already
# in the workspace feature set, along with `macros`/`rt-multi-thread` for
# `#[tokio::test]`.
tokio = { workspace = true }
# Task 31: `stream::unfold`, which builds the SSE stream out of the broadcast
# receiver.
#
# Deliberately NOT `async-stream`: its `stream!` macro is genuinely net-new
# (zero entries in `Cargo.lock`) and expands `unsafe` into the calling crate,
# which `#![forbid(unsafe_code)]` rejects — `forbid` cannot be lifted by a
# local `allow`. `futures-util` is already in the graph at 0.3.34 as `axum`'s
# own dependency, and `unfold` needs no feature beyond what `axum` enables, so
# `default-features = false` here adds no crate and no feature to the build.
#
# Exact `=` pin for the same reason as `axum` and `rust-embed` above.
futures-util = { version = "=0.3.34", default-features = false }
# Task 31: serialises the `roundhouse_proto::ClientEvent` payload into each
# SSE frame's `data:` field.
serde_json = { workspace = true }
# Task 31: parses the session UUID out of a `Last-Event-ID` value and out of
# the URL path. `SessionId` exposes `from_uuid`, not `FromStr`, so the `Uuid`
# has to be parsed here.
#
# No features: this crate only parses, never generates (no `v4`) and never
# serialises a bare `Uuid` (no `serde`). The eight other crates that declare
# `uuid` use a `"1"` range; this one takes the exact `=` pin its own two
# paragraphs above demand of every direct dependency here. The cost is real
# and worth naming: a future workspace-wide `uuid` bump has to touch this line
# too, or resolution pins back to 1.26.0 for everyone.
uuid = "=1.26.0"
# Task 31: `CursorError`'s `Display`, which is what the `400` body says.
thiserror = { workspace = true }

[dev-dependencies]
# Task 30: `ServiceExt::oneshot` drives the router in-process, so the tests
# exercise the real `axum::Router` without binding a socket. Not a normal
# dependency — building a router needs no `tower` surface of our own. Already
# in the lockfile at 0.5.3 as a transitive dependency; pinned to that exact
# version so this declaration cannot drift the resolution.
tower = { version = "=0.5.3", features = ["util"] }
# Task 30 declared `tokio` here as a dev-only dependency. Task 31 (D2) moved
# it to `[dependencies]`: see the comment on that line for why the "a router
# is data" reasoning stopped holding.
