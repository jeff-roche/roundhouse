[package]
name = "roundhouse-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
# Confined exception to the workspace-wide forbid: this crate needs raw
# syscalls (fork/pipe/waitpid, plus one raw seccomp-verification syscall)
# behind one module. See src/probe.rs.
unsafe_code = "deny"

[[bin]]
# Task 27 (lane W5, ruling W5-9, Route B): the pre-authorised Landlock
# pre-exec wrapper. `bwrap` has no native Landlock flag (unlike its native
# `--seccomp FD`), and applying the ruleset via `pre_exec` on the *bwrap*
# `Command` is a dead end (verified empirically, see `landlock_wrap.rs`'s
# module doc comment) — Landlock denies every handled access on mounts
# bwrap itself creates after `restrict_self()`, and bwrap's own setup work
# (uid/gid mapping, `--proc`/`--dev`/bind setup) needs exactly the broad
# access a real ruleset must deny. So this binary runs *inside* bwrap,
# after its namespace already exists, applies the real ruleset via the
# safe `RulesetCreated::restrict_self()`, and `exec`s the real program —
# `CommandExt::exec` is safe, so this binary needs zero `unsafe`. Named
# following the existing `round-` prefix convention (`round`,
# `round-daemon-internal`, `round-yaml-parse-helper`).
name = "round-landlock-exec"
path = "src/bin/round_landlock_exec.rs"

[features]
# Task 27 (ruling W5-9): gates `landlock_wrap`'s grandparent-of-`current_exe()`
# fallback for locating the sibling `round-landlock-exec` binary, the same
# convention `roundhouse-flow`'s `round-yaml-parse-helper` lookup established
# (ruling W5-4) — needed so a `tests/*.rs` integration-test binary (which lives
# in `target/debug/deps/`, not `target/debug/`) can still find it. Activated
# for this crate's own integration tests via the self dev-dependency below.
test-util = []

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "0.2"

# Task 24: `isolate.rs`'s `attest()` computes `net_enforced` from
# `roundhouse-core::{NetworkMechanism, net_enforced_for}`'s honesty table (mechanism
# -> bool), not from `Tier` alone, so this crate can attest honestly rather than
# just claiming an isolation mechanism achieved network enforcement. This lives in
# `roundhouse-core` (not `roundhouse-net`, fix-round-1 security-review finding) so no
# new dependency edge was needed — `roundhouse-core` was already a dependency here.
[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
async-trait = "0.1"
tokio = { workspace = true, features = ["process", "rt", "net", "time", "io-util"] }
thiserror = "2.0"
dashmap = "6"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
# Task 24 fix-round-2 (security-review finding): `bwrap.rs::spawn_under_bwrap` wires
# up bwrap's own `--info-fd` mechanism as a real, synchronous confirmation that
# namespace setup actually completed (not just that fork/exec succeeded) — the
# authoritative signal `isolate.rs::attest()` needs to compute `net_enforced`
# honestly rather than assuming a spawned bwrap process's namespace came up.
# `command-fds`'s own unsafe `pre_exec` internals are unrelated to this crate's own
# `unsafe_code = "deny"` lint (that only governs code written in this crate) — same
# posture as `landlock`/`seccompiler` above, both of which also wrap raw syscalls
# internally. The `tokio` feature flag switches its `CommandFdExt` impl to target
# `tokio::process::Command` (what `spawn_under_bwrap` already uses) instead of
# `std::process::Command`.
command-fds = { version = "0.3", features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
# Self dev-dependency, activating the `test-util` feature for this crate's own
# `tests/*.rs` integration-test crates — `cfg(test)` alone does not cover them,
# only this crate's in-lib `#[cfg(test)] mod tests` (same pattern as
# `roundhouse-flow`'s Cargo.toml, ruling W5-4).
roundhouse-sandbox = { path = ".", features = ["test-util"] }
