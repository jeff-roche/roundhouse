[package]
name = "roundhouse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "round"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
roundhouse-proto = { path = "../roundhouse-proto" }
roundhouse-tui = { path = "../roundhouse-tui" }
color-eyre = { workspace = true }
# `process` on top of the workspace feature set (Task A8/G6): `round daemon`
# spawns the real `round-daemon-internal` binary as a child process rather
# than linking `roundhouse-daemon` in (P10 — see the module doc on
# `commands::daemon`).
tokio = { workspace = true, features = ["process"] }
# Task A8/G6's CLI subcommand scaffold (`round daemon`, `round service
# install`/`uninstall`) — the plan text this task is built from named no
# argument-parsing dependency at all (§5.3 pins none), so this is a net-new
# addition this task introduces, pinned like every other dependency in this
# manifest rather than left floating.
clap = { version = "4.6.6", features = ["derive"] }
thiserror = { workspace = true }
# Same pins as `roundhouse-tui`'s own manifest (Task 19) — this crate constructs
# the real `CrosstermBackend` the dashboard draws into, so the two must agree on
# the `ratatui`/`crossterm` versions or the backend types won't be the same type.
ratatui = { version = "0.30.2", features = ["layout-cache"] }
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
