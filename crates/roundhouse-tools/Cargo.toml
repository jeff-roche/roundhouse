[package]
name = "roundhouse-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
diffy = "0.5.1"
glob = "0.3"
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-sandbox = { path = "../roundhouse-sandbox" }
roundhouse-policy = { path = "../roundhouse-policy" }
tokio = { version = "1.53", features = ["full"] }
thiserror = "2.0.20"
tempfile = "3"
process-wrap = { version = "10.0.0", default-features = false, features = [
    "tokio1",
    "kill-on-drop",
    "process-group",
] }
libc = "0.2.189"

[dev-dependencies]
