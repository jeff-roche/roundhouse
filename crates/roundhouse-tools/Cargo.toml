[package]
name = "roundhouse-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
diffy = "0.5.1"
glob = "0.3"
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-sandbox = { path = "../roundhouse-sandbox" }
roundhouse-policy = { path = "../roundhouse-policy" }
# Task 24: the `http` task executor must be constructible only from a
# `roundhouse_net::ProxyHandle`, so `http` traffic is structurally forced through
# Task 23's `LoopbackProxy` egress allowlist/metadata-IP hard-deny rather than
# reaching the network directly.
roundhouse-net = { path = "../roundhouse-net" }
tokio = { version = "1.53", features = ["full"] }
thiserror = "2.0.20"
tempfile = "3"
# Same version already pinned directly by roundhouse-provider (not
# workspace-pinned) — no `["stream"]` feature needed, `HttpTaskExecutor` only does
# `.get(url).send()`.
reqwest = { version = "0.13.4" }
process-wrap = { version = "10.0.0", default-features = false, features = [
    "tokio1",
    "kill-on-drop",
    "process-group",
] }
libc = "0.2.189"
# Same version process-wrap itself pulls in (kept in step deliberately, to
# avoid two copies of nix in the dependency tree) — used directly by this
# crate for the signal-0 `killpg` liveness probe in `shell/cancel.rs`, since
# process-wrap has no API of its own for "is this process group still
# alive" (only for signalling/waiting on it).
nix = { version = "0.31.1", default-features = false, features = ["signal"] }

[dev-dependencies]
roundhouse-store = { path = "../roundhouse-store" }
once_cell = "1"
