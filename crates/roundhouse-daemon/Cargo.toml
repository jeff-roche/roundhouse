[package]
name = "roundhouse-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "round-daemon-internal"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-proto = { path = "../roundhouse-proto" }
roundhouse-store = { path = "../roundhouse-store" }
roundhouse-policy = { path = "../roundhouse-policy" }
roundhouse-sandbox = { path = "../roundhouse-sandbox" }
roundhouse-provider = { path = "../roundhouse-provider" }
roundhouse-tools = { path = "../roundhouse-tools" }
# ⚠️ KNOWN GAP (Phase 3 review, 2026-09-01): this dependency is NOT yet
# wired — no daemon code path calls `McpHost::start`/`McpExecutor`, so no
# MCP server is spawned or dispatched to at runtime yet. It is declared
# because the seam (`roundhouse-mcp::host`) is built and tested here;
# boot-time wiring needs the engine-side production `TaskSpawner` first.
# See the KNOWN GAP note in `crates/roundhouse-mcp/src/host.rs`.
roundhouse-mcp = { path = "../roundhouse-mcp" }
roundhouse-acp = { path = "../roundhouse-acp" }
roundhouse-bus = { path = "../roundhouse-bus" }
roundhouse-engine = { path = "../roundhouse-engine" }
roundhouse-flow = { path = "../roundhouse-flow" }
roundhouse-sched = { path = "../roundhouse-sched" }
roundhouse-config = { path = "../roundhouse-config" }
roundhouse-tui = { path = "../roundhouse-tui" }
color-eyre = { workspace = true }
# `fs`/`io-util` on top of the workspace feature set: the demo reads the edited
# file back and the socket server writes NDJSON lines. Declared here rather than
# relied on via cross-crate feature unification, which is not a guarantee.
tokio = { workspace = true, features = ["fs", "io-util"] }
futures = "0.3"
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
