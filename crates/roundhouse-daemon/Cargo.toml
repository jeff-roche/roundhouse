[package]
name = "roundhouse-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "round-daemon-internal"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-proto = { path = "../roundhouse-proto" }
roundhouse-store = { path = "../roundhouse-store" }
roundhouse-policy = { path = "../roundhouse-policy" }
roundhouse-sandbox = { path = "../roundhouse-sandbox" }
roundhouse-provider = { path = "../roundhouse-provider" }
roundhouse-tools = { path = "../roundhouse-tools" }
# ⚠️ KNOWN GAP (Phase 3 review, 2026-09-01): this dependency is NOT yet
# wired — no daemon code path calls `McpHost::start`/`McpExecutor`, so no
# MCP server is spawned or dispatched to at runtime yet. It is declared
# because the seam (`roundhouse-mcp::host`) is built and tested here;
# boot-time wiring needs the engine-side production `TaskSpawner` first.
# See the KNOWN GAP note in `crates/roundhouse-mcp/src/host.rs`.
roundhouse-mcp = { path = "../roundhouse-mcp" }
# Phase 7, Task 7: `session_bootstrap.rs` is this crate's first real call
# site for `LoopbackProxy`/`EgressPolicy` — real per-session egress
# registration, replacing `demo.rs`'s network-free stand-in.
roundhouse-net = { path = "../roundhouse-net" }
roundhouse-acp = { path = "../roundhouse-acp" }
roundhouse-bus = { path = "../roundhouse-bus" }
roundhouse-engine = { path = "../roundhouse-engine" }
roundhouse-flow = { path = "../roundhouse-flow" }
roundhouse-sched = { path = "../roundhouse-sched" }
roundhouse-config = { path = "../roundhouse-config" }
roundhouse-tui = { path = "../roundhouse-tui" }
# Phase 7, Task 7: `round-daemon-internal` needs a `--socket PATH` flag (the
# lane file's own correction: "the daemon binary needs a --socket flag, not
# a daemon subcommand of its own"). Same exact pin as `roundhouse-cli`'s own
# manifest (Task A8/G6) — Global Constraints §5.3's pin discipline applies
# regardless of which crate introduces a net-new dependency.
clap = { version = "=4.6.6", features = ["derive"] }
color-eyre = { workspace = true }
# `fs`/`io-util` on top of the workspace feature set: the demo reads the edited
# file back and the socket server writes NDJSON lines. Declared here rather than
# relied on via cross-crate feature unification, which is not a guarantee.
tokio = { workspace = true, features = ["fs", "io-util"] }
# Fix round 1 (security review Important 1 / ruling W1-R33): `FramedRead` +
# `LinesCodec::new_with_max_length` cap `socket_server`'s NDJSON read side at
# a fixed frame length instead of accumulating an unbounded `String`.
# `tokio-util` is already a workspace dependency (root `Cargo.toml`); this
# only turns on its `codec` feature (default feature set is empty), so it
# adds no new dependency.
tokio-util = { workspace = true, features = ["codec"] }
futures = "0.3"
serde_json = { workspace = true }
# Task 4 (Phase 7): `mcp_config.rs`'s `[[mcp_server]]` TOML table parse
# deserializes `roundhouse_config::LoadedConfig::get`'s `&toml::Value`
# directly — the typed parse cannot live in `roundhouse-config` itself
# without giving that crate a `roundhouse-mcp` edge (not authorized; see
# LANE-CONTEXT.md), so it lives here, which already depends on both.
toml = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
# Ruling W1-R96 (fix round 1): no `tracing` subscriber exists anywhere in
# this workspace, so every `tracing::warn!`/`error!` this crate (and
# `roundhouse-engine`, which runs inside this same process) relies on was a
# discarded no-op — including the CF-12(c) fail-closed `NetworkConfigError`
# fallback and `wire_redaction_for_session`'s dropped-secret-count warning.
# Exact pin, matching this lane's own discipline for other net-new
# additions (`clap`, `uuid`).
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# Ruling W1-R99 (fix round 1): this crate's own tests need
# `roundhouse_engine::mcp_spawner::SessionMcp::from_parts` — gated behind
# `roundhouse-engine`'s `test-util` feature — to build a real `SessionMcp`
# without spawning a real MCP subprocess, so `apply_resolved_mcp_servers`
# (the `register_mcp` call W1-R85 requires) can be tested directly. Adding
# a feature-enabled entry here, alongside the feature-less `[dependencies]`
# entry the library code uses, is the same mechanism `roundhouse-engine`
# already uses on itself (`crates/roundhouse-engine/Cargo.toml`) and is
# confirmed NOT to unify into normal (non-test) builds under this
# workspace's `resolver = "2"` (verified directly for that self-dependency
# case; same resolver, same mechanism, applies identically here).
roundhouse-engine = { path = "../roundhouse-engine", features = ["test-util"] }
# `McpTransport` is an `#[async_trait::async_trait]` trait (`roundhouse-mcp`);
# any external `impl` (this crate's fake test transport) needs the same
# macro to match its desugared method signatures.
async-trait = "0.1"
