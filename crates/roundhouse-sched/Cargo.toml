[package]
name = "roundhouse-sched"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-engine = { path = "../roundhouse-engine" }
roundhouse-store = { path = "../roundhouse-store" }
# Deliberate, tracked deviation from the frozen crate dependency table
# (`docs/architecture/02-system-architecture.md` §5.2, which lists this crate's
# dependencies as `core, engine, store`): Task 4 (Subsystem A, `trigger_event`
# persistence + dedupe) mints a `Message`-trigger `Binding`'s own id as the
# `SessionId` under which the daemon-side bus registers a mailbox
# (`bind_message_trigger`/`poll_message_trigger`), which requires calling the
# `Bus` trait directly. Confirmed no dependency cycle: `roundhouse-bus`
# depends only on `roundhouse-core`. See `docs/architecture/02-system-architecture.md`
# §5.2's `roundhouse-sched` row for the matching table update.
roundhouse-bus = { path = "../roundhouse-bus" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# Pinned exact per §5.3's "never track to latest" discipline. `chrono-tz`
# isn't in §5.3's table (trigger scheduling is new this Phase); pinned to
# 0.10.4 rather than a bare "0.10" range. Task 1 originally added this as a
# soft "0.10" requirement — 0.10.4 is what that already resolves and locks
# to on this branch, so tightening to it here (rather than to some other
# 0.10.x) changes no behavior, only the pin discipline.
chrono-tz = { version = "=0.10.4", features = ["serde"] }
# Pinned exact per §5.3's discipline (also not in that table for the same
# reason as chrono-tz above). See `src/cron.rs` for the real (verified
# against the crate source) `Schedule::after`/`upcoming` API this task uses.
cron = "=0.15.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Task 3 (scheduler): only `tokio::time::Instant` is used, for a monotonic
# clock reading that is immune to wall-clock adjustments. No async runtime
# is spun up by this crate, so only the `time` feature is enabled.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
serde_json = { workspace = true }
