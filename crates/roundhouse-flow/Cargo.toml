[package]
name = "roundhouse-flow"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-engine = { path = "../roundhouse-engine" }
roundhouse-store = { path = "../roundhouse-store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Pinned, fixed-algorithm content hash for `content_hash` (Task 1): the point
# of a content hash is that identical content hashes identically across
# processes and across releases. `std::collections::hash_map::DefaultHasher`
# is explicitly NOT stable across releases (Subsystem A hit exactly this
# defect for binding/job addressing and had to replace it) — sha2's SHA-256
# is a fixed, versioned algorithm we pin here instead.
sha2 = "0.10"
# Promoted from a Task 1 dev-dependency to a real one: Task 2's
# `parse::parse_workflow` deserializes workflow YAML at runtime (not just in
# tests), consuming exactly the `workflow_yaml` shape
# `job::Body::to_workflow_yaml` produces. Still unpinned beyond the minor
# version (`"0.9"`, matching what Task 1 already recorded in `Cargo.lock`)
# since `roundhouse-flow`'s frozen deps/pins in the Phase 5 Global
# Constraints don't name a YAML crate at all — this is this crate's own
# choice, not a §5.3 pin.
serde_yaml = "0.9"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
