[package]
name = "roundhouse-flow"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
# Task 14 (lane W5, ruling W5-4): the out-of-process YAML-parsing helper
# `parse::helper` spawns under `roundhouse-sandbox`'s
# `bounded_parse::run_bounded_subprocess`. Named following the existing
# `round-` prefix convention (`round`, `round-daemon-internal`). Deliberately
# tiny — see `src/bin/round_yaml_parse_helper.rs`'s own doc comment.
name = "round-yaml-parse-helper"
path = "src/bin/round_yaml_parse_helper.rs"

[features]
# L7 (security ruling, first applied to `roundhouse-sched`): gates
# `durability::open_test_db` so daemon code can never reach for it as if it
# were the crate's normal way to open a connection — that would silently
# write a run's whole durable state to a private in-memory database that
# vanishes with the process. Activated for this crate's own integration tests
# via the self dev-dependency below; `cfg(test)` alone covers only in-lib unit
# tests, not the separate `tests/*.rs` crates.
test-util = []

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-engine = { path = "../roundhouse-engine" }
roundhouse-store = { path = "../roundhouse-store" }
# Task 16 (`durability.rs`): the `workflow_run`/`workflow_step_run` state
# machine writes directly against a `rusqlite::Connection` via
# `roundhouse_store::begin_immediate` (ruling P4 — the tables themselves live
# in `roundhouse-store`'s migration list, not a per-crate migration file).
# Same workspace-pinned version `roundhouse-store` already uses.
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Pinned, fixed-algorithm content hash for `content_hash` (Task 1): the point
# of a content hash is that identical content hashes identically across
# processes and across releases. `std::collections::hash_map::DefaultHasher`
# is explicitly NOT stable across releases (Subsystem A hit exactly this
# defect for binding/job addressing and had to replace it) — sha2's SHA-256
# is a fixed, versioned algorithm we pin here instead.
sha2 = "0.10"
blake3 = "1"
# Promoted from a Task 1 dev-dependency to a real one: Task 2's
# `parse::parse_workflow` deserializes workflow YAML at runtime (not just in
# tests), consuming exactly the `workflow_yaml` shape
# `job::Body::to_workflow_yaml` produces. Still unpinned beyond the minor
# version (`"0.9"`, matching what Task 1 already recorded in `Cargo.lock`)
# since `roundhouse-flow`'s frozen deps/pins in the Phase 5 Global
# Constraints don't name a YAML crate at all — this is this crate's own
# choice, not a §5.3 pin.
serde_yaml = "0.9"
# Promoted from a dev-dependency (Task 1) to a real one: Task 13's
# `exec::provenance::RunId` is this crate's own identity newtype (ruling P6 —
# `roundhouse-core`'s equivalent macro is private, so `RunId` is written out
# by hand here following the identical pattern), which needs `Uuid` and its
# `serde` impls in non-test code. Same version/feature set
# `roundhouse-core`'s own `Cargo.toml` already pins for the same purpose.
uuid = { version = "1", features = ["v4", "serde"] }
# Task 14 (lane W5, ruling W5-1): the one new Cargo edge this task adds.
# `parse::helper` spawns `round-yaml-parse-helper` under this crate's
# `bounded_parse::run_bounded_subprocess` to run `serde_yaml`'s
# quadratic-cost anchor/alias expansion out of process, under a real
# CPU/wall-clock/output-size bound, rather than trust an in-process byte
# cap against it (see `src/parse/mod.rs`'s module doc comment for the
# measured cost and the residual this closes). Landed atomically with the
# `docs/architecture/02-system-architecture.md` §5.2 row update for this
# crate — `xtask`'s workspace-shape drift guard asserts the two agree.
# `roundhouse-sandbox` exposes only concrete, synchronous, dependency-light
# primitives here and never learns what a workflow is; this crate provides
# the YAML-specific caller on top.
roundhouse-sandbox = { path = "../roundhouse-sandbox" }

[dev-dependencies]
# Self dev-dependency, activating the `test-util` feature for this crate's own
# `tests/*.rs` integration-test crates (L7) — `cfg(test)` alone does not cover
# them, only this crate's in-lib `#[cfg(test)] mod tests`.
roundhouse-flow = { path = ".", features = ["test-util"] }
tempfile = "3"
