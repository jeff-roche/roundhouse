[package]
name = "roundhouse-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
roundhouse-proto = { path = "../roundhouse-proto" }
# Phase 7 Task 2: `Dashboard::apply(SessionId, EventPayload)` and every match
# on `ClientEvent::TaskEvent`'s fields name `SessionId`/`EventPayload`/`Delta`
# directly. `roundhouse-proto` uses those types but re-exports only
# `{ApiVersion, ClientEvent, ClientRequest, client_event_schema,
# client_request_schema}`, so there is no path to them through the `proto`
# edge alone (see `docs/architecture/02-system-architecture.md` §5.2's
# `roundhouse-tui` row, and its `roundhouse-web` row for the identical
# reasoning behind that crate's own `core` edge).
roundhouse-core = { path = "../roundhouse-core" }
schemars = { workspace = true }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2.0.20"
ratatui = { version = "0.30.2", features = ["layout-cache"] }
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
