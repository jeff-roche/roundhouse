[package]
name = "roundhouse-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Phase 8, T19a Task 4: gates `writer::test_util` (a gated `EventWriter` for testing
# `close_session` failure/retry paths), mirroring the identical, security/scope-motivated
# `test-util` feature already in `roundhouse-policy`, `roundhouse-engine` and
# `roundhouse-sandbox` — test-only constructors are absent from ordinary production builds.
# Activated for this crate's own `tests/*.rs` integration tests through the self
# dev-dependency below (`cfg(test)` alone does not cover them), and for `roundhouse-engine`'s
# tests through its own dev-dependency on this crate with the same feature.
test-util = []

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
# Deliberate, tracked deviation from the frozen crate dependency table
# (`docs/architecture/02-system-architecture.md` §5.2, which lists this crate's only
# allowed dependency as `roundhouse-core`): Task 20 (Phase 2, cost-attribution derived
# view) genuinely needs `Cost`/`PricingLookup`/`ModelId`/`ProviderId` from
# `roundhouse-provider::{fallback, ir}` and cannot be built without this edge. Relocating
# those types down into `roundhouse-core` was considered and rejected — they are used
# pervasively throughout `roundhouse-provider`'s own internals (`ChatRequest`,
# `FallbackChain`, circuit-breaker keying), so moving them would be a much larger,
# higher-blast-radius refactor than this task's scope. Confirmed no dependency cycle:
# `roundhouse-provider` depends only on `roundhouse-core`. See `crates/roundhouse-store/
# src/cost.rs` and this task's report for the full ruling.
roundhouse-provider = { path = "../roundhouse-provider" }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
deadpool-sqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.53", features = ["sync", "time"] }
aho-corasick = "1"
arc-swap = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["full"] }
rusqlite = { workspace = true }
# Task 21 Task 1's `tests/commit_feed.rs` only: `now_or_never()`, to assert a `CommitWatch`'s
# `changed()` is still Pending without a sleep (this lane's no-clock-timing-tests rule).
# Dev-only — no production code in this crate depends on `futures`. Same version other
# crates in this workspace already pin their own `futures = "0.3"` dependency edge to
# (`roundhouse-provider`, `roundhouse-engine`, et al.), so this doesn't add a new version
# to the lockfile.
futures = "0.3"
# Self dev-dependency, activating the `test-util` feature for this crate's own `tests/*.rs`
# integration-test crates — `cfg(test)` alone does not cover them, only this crate's in-lib
# `#[cfg(test)] mod tests`. Mirrors the identical pattern in `roundhouse-policy`/
# `roundhouse-engine`.
roundhouse-store = { path = ".", features = ["test-util"] }
