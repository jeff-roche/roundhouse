[package]
name = "roundhouse-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-store = { path = "../roundhouse-store" }
roundhouse-policy = { path = "../roundhouse-policy" }
roundhouse-net = { path = "../roundhouse-net" }
roundhouse-sandbox = { path = "../roundhouse-sandbox" }
roundhouse-provider = { path = "../roundhouse-provider" }
roundhouse-bus = { path = "../roundhouse-bus" }
# Task 4 (Phase 7): `EngineTaskSpawner` (`src/mcp_spawner.rs`) implements
# `roundhouse_mcp::executor::TaskSpawner`, and session creation calls
# `roundhouse_mcp::host::McpHost::start` directly — see this crate's row in
# `docs/architecture/02-system-architecture.md` §5.2, amended in the same
# commit as this edge (ruling W1-R1).
roundhouse-mcp = { path = "../roundhouse-mcp" }
# Task 5 (Phase 7, ruling W1-R1): `src/tool_dispatch.rs` dispatches a
# model-issued `ToolUse` to `roundhouse_tools`' real read/write/edit/find/shell
# executors — the agent loop's built-in tool arm — so this crate needs a real
# dependency on `roundhouse-tools`, not just a same-workspace sibling.
roundhouse-tools = { path = "../roundhouse-tools" }
schemars = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
thiserror = { workspace = true }
tokio = { version = "1.53", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["full"] }
once_cell = "1"
