[package]
name = "roundhouse-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-store = { path = "../roundhouse-store" }
roundhouse-policy = { path = "../roundhouse-policy" }
roundhouse-net = { path = "../roundhouse-net" }
roundhouse-sandbox = { path = "../roundhouse-sandbox" }
roundhouse-provider = { path = "../roundhouse-provider" }
roundhouse-bus = { path = "../roundhouse-bus" }
schemars = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
thiserror = { workspace = true }
tokio = { version = "1.53", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["full"] }
once_cell = "1"
async-trait = "0.1"
