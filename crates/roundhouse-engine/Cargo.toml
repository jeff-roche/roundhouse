[package]
name = "roundhouse-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-store = { path = "../roundhouse-store" }
roundhouse-policy = { path = "../roundhouse-policy" }
roundhouse-sandbox = { path = "../roundhouse-sandbox" }
roundhouse-provider = { path = "../roundhouse-provider" }
roundhouse-bus = { path = "../roundhouse-bus" }
serde_json = { workspace = true }
futures = "0.3"
thiserror = { workspace = true }
tokio = { version = "1.53", features = ["sync"] }

[dev-dependencies]
schemars = { workspace = true }
tempfile = "3"
tokio = { version = "1.53", features = ["full"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
