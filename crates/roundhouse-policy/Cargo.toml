[package]
name = "roundhouse-policy"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
brush-parser = "0.4"
globset = "0.4"
roundhouse-core = { path = "../roundhouse-core" }
roundhouse-store = { path = "../roundhouse-store" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dashmap = "6"
blake3 = "1"
thiserror = { workspace = true }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
once_cell = "1"
# Pinned to the same "1" spec as every other trybuild-using crate in this
# workspace (roundhouse-core, roundhouse-net, roundhouse-secrets,
# roundhouse-web) — see crates/roundhouse-web/Cargo.toml's comment for why
# this is a loose `"1"` and not an exact `=` pin.
trybuild = "1"
