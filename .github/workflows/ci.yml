name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `@stable` resolves as a mutable git ref (the tip of a branch that
      # moves with every Rust release), so it is not reproducible across
      # runs and can silently change which lints fire — see refresh-pricing.yml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-09-02
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-09-02
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-09-02
      - uses: Swatinem/rust-cache@v2
      # A handful of roundhouse-daemon tests need a genuinely-spawning
      # system `bwrap` (Phase 8 Task 25.4 Task 4's §8.13 mid-dispatch
      # shell-cancel/timeout tests — see
      # crates/roundhouse-daemon/src/lib.rs's `available_isolate_with_real_bwrap`).
      # Ubuntu 24.04+ restricts unprivileged user-namespace creation by
      # default via AppArmor, which is bwrap's most common real-world
      # failure ("Creating new namespace failed: Operation not permitted" —
      # see roundhouse-sandbox's bwrap.rs). docs/architecture/
      # 03-security-and-sandboxing.md §6.5 names the fix this project
      # ships in production: a narrowly-scoped AppArmor profile permitting
      # `userns create` for the bwrap binary specifically — and is explicit
      # that we never suggest flipping the global
      # kernel.apparmor_restrict_unprivileged_userns sysctl instead. This
      # mirrors that for CI's system (not vendored) bwrap binary.
      - name: Install bubblewrap and permit its user-namespace creation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          BWRAP_PATH="$(command -v bwrap)"
          cat <<PROFILE | sudo tee /etc/apparmor.d/bwrap-userns >/dev/null
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap $BWRAP_PATH flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns
      - run: cargo test --workspace

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-09-02
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
