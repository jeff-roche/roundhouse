name: Refresh pricing dataset
on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Fix round 1, O3: default permissions are broader than this job needs —
    # `cargo run` executes the build scripts of the whole dependency tree, so
    # the token available to that step should be no wider than what the PR
    # step actually requires.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Fix round 1, O3: every action pinned to a commit SHA, not a mutable
      # tag/branch — `dtolnay/rust-toolchain@stable` in particular resolves
      # `stable` as a git ref, i.e. a branch whose tip moves, so `@stable`
      # alone is not reproducible and its content can change between runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-09-02
      - name: Run refresh binary
        run: cargo run -p roundhouse-provider --bin refresh_pricing -- crates/roundhouse-provider/vendor
      # Fix round 1, O3: the refresh binary already validates shape and a
      # minimum entry count before writing (O2), but this is the second,
      # independent gate — the real workspace test suite, including
      # `vendored_snapshot_parses_and_prices_a_known_model`, which forces
      # `PricingSnapshot::vendored()`'s `LazyLock` to actually evaluate
      # against the freshly-written files — so a broken snapshot fails the
      # job instead of becoming a PR a human then has to catch by hand.
      - name: Test the freshly-refreshed snapshot
        run: cargo test -p roundhouse-provider
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(pricing): weekly models.dev/LiteLLM snapshot refresh"
          branch: pricing-refresh/${{ github.run_id }}
          title: "Weekly pricing dataset refresh"
          body: |
            Automated refresh of vendored models.dev + LiteLLM pricing snapshots.
            **Human review required before merge** — this changes cost-attribution
            numbers shown to users (§9.7). Runtime refresh is opt-in and never
            blocks a request; this PR is the only path a price change reaches
            production.
          labels: pricing-refresh
